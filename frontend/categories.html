<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Categories — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="categories">

<div id="sidebar"></div>
<div id="topbar"></div>

<div id="page-content">

  <div class="page-header">
    <div>
      <h1>Categories</h1>
      <p>Group products for easier browsing and filtering.</p>
    </div>
  </div>

  <div class="card-panel mb-3" data-admin-only>
    <div class="row g-2">
      <div class="col"><input id="name" class="form-control" placeholder="Category name"></div>
      <div class="col-auto"><button class="btn btn-primary" id="submitBtn" onclick="submit()">Add Category</button></div>
    </div>
  </div>

  <div class="card-panel">
    <table class="table">
      <thead><tr><th>Name</th><th data-admin-only>Actions</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
let editingId = null;

async function load() {
  showSkeleton("list", 2);
  const categories = await getCategories();
  document.getElementById("list").innerHTML = categories.length ? categories.map(c => `
    <tr>
      <td>${c.name}</td>
      <td data-admin-only>
        <button class="btn btn-sm btn-outline-warning" onclick="edit(${c.id}, '${c.name.replace(/'/g, "\\'")}')">Edit</button>
        <button class="btn btn-sm btn-outline-danger" onclick="remove(${c.id})">Delete</button>
      </td>
    </tr>`).join("") : emptyStateRow(2, "No categories yet", "🏷️");
  if (!isAdmin()) document.querySelectorAll("[data-admin-only]").forEach(el => el.remove());
}

function edit(id, name) {
  editingId = id;
  document.getElementById("name").value = name;
  document.getElementById("submitBtn").innerText = "Update Category";
}

async function submit() {
  const name = document.getElementById("name").value;
  if (!name) return;
  const res = editingId ? await updateCategory(editingId, { name }) : await addCategory({ name });
  toast(res.msg || "Saved");
  editingId = null;
  document.getElementById("name").value = "";
  document.getElementById("submitBtn").innerText = "Add Category";
  load();
}

async function remove(id) {
  if (!confirm("Delete this category?")) return;
  const res = await deleteCategory(id);
  toast(res.msg || "Deleted");
  load();
}

load();
</script>

</body>
</html>
