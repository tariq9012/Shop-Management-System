<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Customers — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="customers">

<div id="sidebar"></div>
<div id="topbar"></div>

<div id="page-content">

  <div class="page-header">
    <div>
      <h1>Customers</h1>
      <p>Contacts, loyalty points and purchase history.</p>
    </div>
    <button class="btn btn-outline-secondary btn-sm" onclick="exportCustomers()">⬇ Export CSV</button>
  </div>

  <div class="card-panel mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label small">Search</label>
        <input id="search" class="form-control" placeholder="Name, contact or email...">
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-secondary w-100" onclick="currentPage=1; load();">Search</button>
      </div>
      <div class="col-md-6 text-end">
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#customerModal" onclick="resetForm()">+ Add Customer</button>
      </div>
    </div>
  </div>

  <div class="card-panel">
    <table class="table align-middle">
      <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Loyalty Pts</th><th>Actions</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="customerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="customerModalTitle">Add Customer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2"><label class="form-label small">Name</label><input id="name" class="form-control"></div>
        <div class="mb-2"><label class="form-label small">Contact</label><input id="contact" class="form-control"></div>
        <div class="mb-2"><label class="form-label small">Email</label><input id="email" class="form-control"></div>
        <div class="mb-2"><label class="form-label small">Address</label><input id="address" class="form-control"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" id="submitBtn" onclick="submitCustomer()">Add Customer</button>
      </div>
    </div>
  </div>
</div>

<!-- History Modal -->
<div class="modal fade" id="historyModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="historyModalTitle">Purchase History</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table table-sm">
          <thead><tr><th>Invoice</th><th>Total</th><th>Payment</th><th>Date</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
let editingId = null;
let currentPage = 1;
let modal, historyModal;

async function load() {
  showSkeleton("list", 5);
  const search = document.getElementById("search").value;
  const res = await getCustomers({ search, page: currentPage, limit: 10 });

  const list = document.getElementById("list");
  if (!res.data) {
    list.innerHTML = `<tr><td colspan="5">${res.msg || "Could not load customers"}</td></tr>`;
    return;
  }

  list.innerHTML = res.data.length ? res.data.map(c => `
    <tr>
      <td>${c.name}</td>
      <td>${c.contact || ""}</td>
      <td>${c.email || ""}</td>
      <td>${c.loyalty_points}</td>
      <td>
        <button class="btn btn-sm btn-outline-secondary" onclick="viewHistory(${c.id}, '${c.name.replace(/'/g, "\\'")}')">History</button>
        <button class="btn btn-sm btn-outline-warning" onclick='editCustomer(${JSON.stringify(c)})'>Edit</button>
        <button class="btn btn-sm btn-outline-danger" data-admin-only onclick="removeCustomer(${c.id})">Delete</button>
      </td>
    </tr>`).join("") : emptyStateRow(5, "No customers found — add your first one", "👥");

  if (!isAdmin()) document.querySelectorAll("[data-admin-only]").forEach(el => el.remove());
  renderPagination(res.page, res.pages);
}

function renderPagination(page, pages) {
  const el = document.getElementById("pagination");
  if (pages <= 1) { el.innerHTML = ""; return; }
  let html = "";
  for (let i = 1; i <= pages; i++) {
    html += `<li class="page-item ${i === page ? "active" : ""}"><a class="page-link" href="#" onclick="currentPage=${i}; load(); return false;">${i}</a></li>`;
  }
  el.innerHTML = html;
}

async function viewHistory(id, name) {
  document.getElementById("historyModalTitle").innerText = `Purchase History — ${name}`;
  const data = await getCustomerHistory(id);
  document.getElementById("historyBody").innerHTML = data.sales.length
    ? data.sales.map(s => `<tr><td>${s.invoice_no}</td><td>${money(s.total)}</td><td>${s.payment_method}</td><td>${new Date(s.created_at).toLocaleString()}</td></tr>`).join("")
    : `<tr><td colspan="4" class="text-muted">No purchases yet</td></tr>`;
  historyModal.show();
}

function editCustomer(c) {
  editingId = c.id;
  document.getElementById("customerModalTitle").innerText = "Edit Customer";
  document.getElementById("submitBtn").innerText = "Update Customer";
  document.getElementById("name").value = c.name;
  document.getElementById("contact").value = c.contact || "";
  document.getElementById("email").value = c.email || "";
  document.getElementById("address").value = c.address || "";
  modal.show();
}

function resetForm() {
  editingId = null;
  document.getElementById("customerModalTitle").innerText = "Add Customer";
  document.getElementById("submitBtn").innerText = "Add Customer";
  ["name", "contact", "email", "address"].forEach(id => document.getElementById(id).value = "");
}

async function submitCustomer() {
  const data = {
    name: document.getElementById("name").value,
    contact: document.getElementById("contact").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value
  };
  if (!data.name) { toast("Customer name is required", "danger"); return; }

  const res = editingId ? await updateCustomer(editingId, data) : await addCustomer(data);
  toast(res.msg || "Saved");
  modal.hide();
  resetForm();
  load();
}

async function removeCustomer(id) {
  if (!confirm("Delete this customer?")) return;
  const res = await deleteCustomer(id);
  toast(res.msg || "Deleted");
  load();
}

async function exportCustomers() {
  const res = await getCustomers({ limit: 200 });
  exportCSV("customers.csv", res.data.map(c => ({
    name: c.name,
    contact: c.contact || "",
    email: c.email || "",
    address: c.address || "",
    loyalty_points: c.loyalty_points
  })));
}

document.addEventListener("DOMContentLoaded", () => {
  modal = new bootstrap.Modal(document.getElementById("customerModal"));
  historyModal = new bootstrap.Modal(document.getElementById("historyModal"));
  load();
});
</script>

</body>
</html>
