<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Invoice — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    body { background: #eef0ee; }
    .receipt {
      max-width: 480px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: .5rem;
      border: 1px solid var(--border);
    }
    .receipt h2 { font-weight: 800; margin-bottom: 0; }
    .receipt .muted { color: var(--ink-muted); font-size: .85rem; }
    .receipt table { width: 100%; font-size: .9rem; }
    .receipt hr { border-top: 1px dashed #ccc; }
    @media print {
      body { background: #fff; }
      .receipt { border: none; margin: 0; max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="receipt">
  <div class="text-center mb-3">
    <h2 id="shopName">Shop</h2>
    <div class="muted" id="shopAddress"></div>
    <div class="muted" id="shopPhone"></div>
  </div>
  <hr>
  <div class="d-flex justify-content-between muted mb-2">
    <span id="invoiceNo"></span>
    <span id="invoiceDate"></span>
  </div>
  <div class="mb-2" id="customerLine"></div>
  <hr>
  <table class="mb-2">
    <thead><tr><th>Item</th><th class="text-end">Qty</th><th class="text-end">Total</th></tr></thead>
    <tbody id="itemsBody"></tbody>
  </table>
  <hr>
  <table class="mb-2">
    <tr><td>Subtotal</td><td class="text-end" id="subtotalOut"></td></tr>
    <tr><td>Discount</td><td class="text-end" id="discountOut"></td></tr>
    <tr><td>Tax</td><td class="text-end" id="taxOut"></td></tr>
    <tr class="fw-bold fs-5"><td>Total</td><td class="text-end" id="totalOut"></td></tr>
  </table>
  <hr>
  <div class="text-center muted" id="receiptNote"></div>

  <div class="text-center mt-4 no-print">
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
    <a href="sales-history.html" class="btn btn-outline-secondary">Back</a>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
async function load() {
  requireAuth();
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (!id) { document.body.innerHTML = "<p class='text-center mt-5'>No invoice specified.</p>"; return; }

  const [sale, settings] = await Promise.all([getSale(id), getSettings()]);

  document.getElementById("shopName").innerText = settings.shop_name || "Shop";
  document.getElementById("shopAddress").innerText = settings.address || "";
  document.getElementById("shopPhone").innerText = settings.phone ? `Tel: ${settings.phone}` : "";
  document.getElementById("invoiceNo").innerText = `Invoice: ${sale.invoice_no}`;
  document.getElementById("invoiceDate").innerText = new Date(sale.created_at).toLocaleString();
  document.getElementById("customerLine").innerText = `Customer: ${sale.customer || "Walk-in"}`;
  document.getElementById("itemsBody").innerHTML = sale.items.map(i => `
    <tr><td>${i.product_name}</td><td class="text-end">${i.quantity}</td><td class="text-end">${money(i.subtotal)}</td></tr>
  `).join("");
  document.getElementById("subtotalOut").innerText = money(sale.subtotal);
  document.getElementById("discountOut").innerText = `- ${money(sale.discount)}`;
  document.getElementById("taxOut").innerText = money(sale.tax);
  document.getElementById("totalOut").innerText = money(sale.total);
  document.getElementById("receiptNote").innerText = settings.receipt_note || "";

  if (sale.refunded_total > 0) {
    document.getElementById("customerLine").innerHTML += `<br><span class="text-danger">Refunded: ${money(sale.refunded_total)}</span>`;
  }
}

load();
</script>

</body>
</html>
