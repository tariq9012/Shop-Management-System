<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--bg);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .6rem;
      padding: 2.2rem;
    }
    .auth-logo {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      margin: 0 auto .9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="col-11 col-sm-7 col-md-4 mx-auto auth-card">
    <div class="auth-logo">🏪</div>
    <h4 class="text-center mb-1 fw-bold">Shop Manager</h4>
    <p class="text-center text-muted small mb-4">Sign in to your account</p>

    <input id="username" class="form-control mb-2" placeholder="Username" autofocus>
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary w-100" onclick="login()">Sign In</button>
    <p id="msg" class="text-danger text-center mt-2 mb-0 small"></p>
    <p class="text-center mt-3 mb-0 small">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const msgEl = document.getElementById("msg");

  if (!username || !password) {
    msgEl.innerText = "Enter your username and password";
    return;
  }

  const res = await loginUser(username, password);

  if (res.token) {
    localStorage.setItem("token", res.token);
    localStorage.setItem("user", JSON.stringify(res.user));
    window.location.href = "dashboard.html";
  } else {
    msgEl.innerText = res.msg || "Login failed";
  }
}

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
