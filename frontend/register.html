<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Register — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--bg);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .6rem;
      padding: 2.2rem;
    }
    .auth-logo {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      margin: 0 auto .9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="col-11 col-sm-7 col-md-4 mx-auto auth-card">
    <div class="auth-logo">🏪</div>
    <h4 class="text-center mb-1 fw-bold">Create Account</h4>
    <p class="text-center text-muted small mb-4">The first account created becomes the admin</p>

    <input id="username" class="form-control mb-2" placeholder="Username">
    <input id="email" class="form-control mb-2" placeholder="Email (optional)">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password (min 6 chars)">

    <button class="btn btn-primary w-100" onclick="register()">Create Account</button>
    <p id="msg" class="text-center mt-2 mb-0 small"></p>
    <p class="text-center mt-3 mb-0 small">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
async function register() {
  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msgEl = document.getElementById("msg");

  if (!username || !password) {
    msgEl.className = "text-danger text-center mt-2 mb-0 small";
    msgEl.innerText = "Username and password are required";
    return;
  }

  const res = await registerUser(username, password, email);

  if (res.msg === "User registered successfully") {
    msgEl.className = "text-success text-center mt-2 mb-0 small";
    msgEl.innerText = `Account created as ${res.role}. Redirecting to login...`;
    setTimeout(() => (window.location.href = "login.html"), 1200);
  } else {
    msgEl.className = "text-danger text-center mt-2 mb-0 small";
    msgEl.innerText = res.msg || "Registration failed";
  }
}
</script>

</body>
</html>
