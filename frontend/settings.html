<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shop Settings — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="settings">

<div id="sidebar"></div>
<div id="topbar"></div>

<div id="page-content">
  <div class="page-header">
    <div>
      <h1>Shop Settings</h1>
      <p>This information appears on printed invoices and throughout the app.</p>
    </div>
  </div>

  <div class="card-panel" style="max-width: 560px;">
    <div class="mb-3">
      <label class="form-label small">Shop Name</label>
      <input id="shop_name" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label small">Address</label>
      <input id="address" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label small">Phone</label>
      <input id="phone" class="form-control">
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label small">Currency Symbol</label>
        <input id="currency_symbol" class="form-control" placeholder="Rs">
      </div>
      <div class="col mb-3">
        <label class="form-label small">Default Tax Rate (%)</label>
        <input id="default_tax_rate" type="number" step="0.01" class="form-control">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label small">Receipt Footer Note</label>
      <input id="receipt_note" class="form-control" placeholder="Thank you for shopping with us!">
    </div>
    <button class="btn btn-primary" onclick="save()">Save Settings</button>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
async function load() {
  const s = await getSettings();
  document.getElementById("shop_name").value = s.shop_name || "";
  document.getElementById("address").value = s.address || "";
  document.getElementById("phone").value = s.phone || "";
  document.getElementById("currency_symbol").value = s.currency_symbol || "Rs";
  document.getElementById("default_tax_rate").value = s.default_tax_rate || 0;
  document.getElementById("receipt_note").value = s.receipt_note || "";
}

async function save() {
  const data = {
    shop_name: document.getElementById("shop_name").value,
    address: document.getElementById("address").value,
    phone: document.getElementById("phone").value,
    currency_symbol: document.getElementById("currency_symbol").value,
    default_tax_rate: parseFloat(document.getElementById("default_tax_rate").value) || 0,
    receipt_note: document.getElementById("receipt_note").value
  };
  const res = await updateSettings(data);
  localStorage.setItem("shop_name", data.shop_name);
  toast(res.msg || "Saved");
}

load();
</script>

</body>
</html>
