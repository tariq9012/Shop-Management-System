<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Suppliers — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="suppliers">

<div id="sidebar"></div>
<div id="topbar"></div>

<div id="page-content">

  <div class="page-header">
    <div>
      <h1>Suppliers</h1>
      <p>Who you restock inventory from.</p>
    </div>
  </div>

  <div class="card-panel mb-3" data-admin-only>
    <div class="row g-2">
      <div class="col"><input id="name" class="form-control" placeholder="Supplier name"></div>
      <div class="col"><input id="contact" class="form-control" placeholder="Contact"></div>
      <div class="col"><input id="email" class="form-control" placeholder="Email"></div>
      <div class="col"><input id="address" class="form-control" placeholder="Address"></div>
      <div class="col-auto"><button class="btn btn-primary" id="submitBtn" onclick="submit()">Add Supplier</button></div>
    </div>
  </div>

  <div class="card-panel">
    <table class="table">
      <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Address</th><th data-admin-only>Actions</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
let editingId = null;

async function load() {
  showSkeleton("list", 5);
  const suppliers = await getSuppliers();
  document.getElementById("list").innerHTML = suppliers.length ? suppliers.map(s => `
    <tr>
      <td>${s.name}</td>
      <td>${s.contact || ""}</td>
      <td>${s.email || ""}</td>
      <td>${s.address || ""}</td>
      <td data-admin-only>
        <button class="btn btn-sm btn-outline-warning" onclick='edit(${JSON.stringify(s)})'>Edit</button>
        <button class="btn btn-sm btn-outline-danger" onclick="remove(${s.id})">Delete</button>
      </td>
    </tr>`).join("") : emptyStateRow(5, "No suppliers yet", "🚚");
  if (!isAdmin()) document.querySelectorAll("[data-admin-only]").forEach(el => el.remove());
}

function edit(s) {
  editingId = s.id;
  document.getElementById("name").value = s.name;
  document.getElementById("contact").value = s.contact || "";
  document.getElementById("email").value = s.email || "";
  document.getElementById("address").value = s.address || "";
  document.getElementById("submitBtn").innerText = "Update Supplier";
}

async function submit() {
  const data = {
    name: document.getElementById("name").value,
    contact: document.getElementById("contact").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value
  };
  if (!data.name) return;
  const res = editingId ? await updateSupplier(editingId, data) : await addSupplier(data);
  toast(res.msg || "Saved");
  editingId = null;
  ["name", "contact", "email", "address"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("submitBtn").innerText = "Add Supplier";
  load();
}

async function remove(id) {
  if (!confirm("Delete this supplier?")) return;
  const res = await deleteSupplier(id);
  toast(res.msg || "Deleted");
  load();
}

load();
</script>

</body>
</html>
