<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Users — Shop Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="users">

<div id="sidebar"></div>
<div id="topbar"></div>

<div id="page-content">
  <div class="page-header">
    <div>
      <h1>Users</h1>
      <p>Manage who has access and what they're allowed to do.</p>
    </div>
  </div>

  <div class="card-panel">
    <table class="table align-middle">
      <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
let me = null;

async function load() {
  showSkeleton("list", 6);
  me = currentUser();
  const users = await getUsers();

  document.getElementById("list").innerHTML = users.length ? users.map(u => `
    <tr>
      <td>${u.username}${u.id === me.id ? ' <span class="text-muted small">(you)</span>' : ''}</td>
      <td>${u.email || ""}</td>
      <td>
        <select class="form-select form-select-sm" style="width:110px" ${u.id === me.id ? "disabled" : ""}
                onchange="changeRole(${u.id}, this.value)">
          <option value="staff" ${u.role === "staff" ? "selected" : ""}>Staff</option>
          <option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option>
        </select>
      </td>
      <td>
        <span class="badge ${u.is_active ? 'bg-success' : 'bg-secondary'}">${u.is_active ? "Active" : "Disabled"}</span>
      </td>
      <td>${new Date(u.created_at).toLocaleDateString()}</td>
      <td>
        ${u.id === me.id ? "" : `
          <button class="btn btn-sm btn-outline-secondary" onclick="toggleStatus(${u.id}, ${u.is_active ? 0 : 1})">
            ${u.is_active ? "Disable" : "Enable"}
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="remove(${u.id})">Delete</button>
        `}
      </td>
    </tr>`).join("") : emptyStateRow(6, "No users found");
}

async function changeRole(id, role) {
  const res = await updateUserRole(id, role);
  toast(res.msg || "Updated");
  load();
}

async function toggleStatus(id, is_active) {
  const res = await updateUserStatus(id, is_active);
  toast(res.msg || "Updated");
  load();
}

async function remove(id) {
  if (!confirm("Delete this user? This cannot be undone.")) return;
  const res = await deleteUser(id);
  toast(res.msg || "Deleted");
  load();
}

load();
</script>

</body>
</html>
